<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:0 0 40px 0;">
              <!-- Swap this block for <img src="https://your-domain/logo.png" alt="Videoflix" width="220"> once deployed -->
              <span style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:34px; font-weight:700; letter-spacing:1px; color:#5B2BEA;">
                &#10148;&nbsp;VIDEOFLIX
              </span>
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.6; color:#202124; padding:0 0 4px 0;">
              Dear <span style="color:#3547FF;">{{ user_email }}</span>,
            </td>
          </tr>

          <!-- Intro -->
          <tr>
            <td style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.6; color:#202124; padding:0 0 32px 0;">
              Thank you for registering with <span style="color:#3547FF;">Videoflix</span>. To complete your registration and verify your email address, please click the link below:
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td style="padding:0 0 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#2436E8" style="border-radius:40px;">
                    <a href="{{ activation_link }}"
                       style="display:inline-block; padding:16px 40px; font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:17px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:40px;">
                      Activate account
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Disclaimer -->
          <tr>
            <td style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.6; color:#202124; padding:0 0 24px 0;">
              If you did not create an account with us, please disregard this email.
            </td>
          </tr>

          <!-- Sign off -->
          <tr>
            <td style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.6; color:#202124; padding:0 0 24px 0;">
              Best regards,
            </td>
          </tr>
          <tr>
            <td style="font-family:'DM Sans','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.6; color:#202124;">
              Your Videoflix Team.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
